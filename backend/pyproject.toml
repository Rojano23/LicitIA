[project]
name = "licitia-backend"
version = "0.1.0"
description = "LicitIA backend for Tender workspace MVP-01.1"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF==1.28.2",
  "pytesseract==0.3.13",
  "camelot-py==2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
  "local_ollama: opt-in real local Ollama integration tests (never run by default)",
]
